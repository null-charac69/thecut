name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run test:unit

  api:
    # Needs repo secrets TEST_A_EMAIL, TEST_A_PASSWORD, TEST_B_EMAIL, TEST_B_PASSWORD (throwaway users).
    # Without them the tests skip rather than fail.
    runs-on: ubuntu-latest
    env:
      TEST_A_EMAIL: ${{ secrets.TEST_A_EMAIL }}
      TEST_A_PASSWORD: ${{ secrets.TEST_A_PASSWORD }}
      TEST_B_EMAIL: ${{ secrets.TEST_B_EMAIL }}
      TEST_B_PASSWORD: ${{ secrets.TEST_B_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r tests/api/requirements.txt
      - run: python -m pytest tests/api -q

  e2e:
    # Smoke tests against production (or set E2E_BASE_URL via workflow_dispatch environment).
    # Needs secrets E2E_EMAIL, E2E_PASSWORD (a throwaway user with no plan).
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    env:
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
